        <h3 id="subtitulo_comentario">Brinda tu opinión sobre los dinosaurios y el mundo prehistórico:</h3>
            <section id="sec_comentarios">
                <form action="/ComentariosServlet" method="POST" accept-charset="UTF-8">
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required><br><br>
                    <label for="comentario">Comentario:</label><br>
                    <textarea id="comentario" name="comentario" rows="4" cols="50" required></textarea><br><br>
                    <button type="submit">Enviar Comentario</button>
                </form>
            </section>
