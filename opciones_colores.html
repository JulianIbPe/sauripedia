<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opciones de color | Sauripedia</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#111 url(imagenes/fondo_jurassico_renderizado.webp) center/cover fixed;min-height:100vh;color:#fff}
header.t{text-align:center;padding:26px 16px 6px}
header.t h1{display:inline-block;background:rgba(0,0,0,.85);padding:10px 22px;border-radius:16px;font-size:clamp(22px,4vw,34px)}
header.t p{display:inline-block;margin-top:12px;background:rgba(0,0,0,.85);padding:10px 16px;border-radius:12px;max-width:760px;line-height:1.5}
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px;padding:20px;max-width:1500px;margin:auto}
.tema{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.25);background:var(--fondo) ;position:relative;color:var(--texto)}
.tema .foto{position:absolute;inset:0;background:url(imagenes/fondo_jurassico_renderizado.webp) center/cover;filter:var(--filtro);opacity:var(--op)}
.tema>*:not(.foto){position:relative}
.nav{background:var(--nav);border-bottom:2px solid var(--acento);padding:10px 14px;display:flex;gap:14px;align-items:center;font-weight:bold;font-size:15px;color:var(--acento)}
.nav .sp{flex:1}
.nav .b{background:#fff;color:#000;border-radius:12px;padding:3px 10px;font-size:13px}
.nav .b.d{background:var(--acento);color:var(--sobre)}
.cont{padding:18px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:2px solid var(--acento);border-radius:20px;padding:14px;line-height:1.5;font-size:14px}
.panel h3{color:var(--acento);font-style:italic;font-size:22px;margin-bottom:6px}
.panel input{width:100%;margin-top:8px;padding:10px 14px;border-radius:10px;border:2px solid var(--acento);background:var(--campo);color:var(--texto);font-size:15px}
.panel input::placeholder{color:var(--texto);opacity:.6}
.btn{align-self:center;background:var(--acento);color:var(--sobre);font-weight:bold;border:2px solid #000;border-radius:18px;padding:8px 22px}
.nombre{margin:12px 18px 0;width:fit-content;background:rgba(0,0,0,.7);border-radius:10px;padding:4px 10px;font-size:19px;font-weight:bold;color:#fff;text-shadow:0 1px 4px #000}
.desc{margin:6px 18px 0;background:rgba(0,0,0,.7);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.45;color:#eee;text-shadow:0 1px 3px #000}
.sw{display:flex;gap:6px;padding:8px 18px 0}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid #fff}
</style></head><body>
<header class="t"><h1>Opciones para cambiar el color del sitio</h1><br>
<p>Cada tarjeta muestra el nav, un panel, un formulario y los botones con otra paleta. Dime cuál prefieres (o una mezcla) y la aplico a todo el sitio.</p></header>
<div class="rej" id="r"></div>
<script>
const T=[
["1 · Medianoche verde","Mismo verde pero mucho más oscuro y apagado: fondo casi negro, acento verde menta suave. Elegante y de bajo brillo.",
 {fondo:"#050a05",nav:"#000",acento:"#7fd36a",texto:"#e6f2e1",panel:"rgba(6,18,8,.9)",campo:"#030803",sobre:"#04140a",filtro:"brightness(.35) saturate(.7)",op:.9}],
["2 · Savia ámbar","Cambia el verde por dorado/ámbar sobre marrón oscuro; evoca el ámbar con insectos fosilizados.",
 {fondo:"#140d03",nav:"#0b0702",acento:"#ffb627",texto:"#fff1d6",panel:"rgba(40,22,4,.88)",campo:"#0d0801",sobre:"#1a0f00",filtro:"sepia(1) hue-rotate(-10deg) brightness(.45)",op:.9}],
["3 · Océano mesozoico","Azul petróleo y cian: recuerda a los mares de plesiosaurios y mosasaurios. Contraste alto y aspecto frío.",
 {fondo:"#03111a",nav:"#020a10",acento:"#38d9f5",texto:"#e1f6ff",panel:"rgba(3,28,44,.88)",campo:"#020c13",sobre:"#00212b",filtro:"hue-rotate(110deg) brightness(.45) saturate(1.3)",op:.9}],
["4 · Volcán del Triásico","Rojo anaranjado sobre gris carbón oscuro. Dramático y muy contrastado.",
 {fondo:"#120706",nav:"#080303",acento:"#ff6a3d",texto:"#ffe9e0",panel:"rgba(38,12,8,.88)",campo:"#0b0403",sobre:"#1c0600",filtro:"sepia(1) hue-rotate(-45deg) saturate(2) brightness(.4)",op:.9}],
["5 · Cretácico violeta","Violeta y lila sobre morado profundo: distinto a cualquier sitio de dinosaurios, moderno y nocturno.",
 {fondo:"#0d0716",nav:"#07030d",acento:"#b794ff",texto:"#f0e9ff",panel:"rgba(24,12,44,.88)",campo:"#08030f",sobre:"#14062a",filtro:"hue-rotate(190deg) brightness(.42) saturate(1.2)",op:.9}],
["6 · Pergamino y bosque (claro)","Opuesto a lo oscuro: papel crema, texto verde bosque y acento verde profundo. Lo más legible para leer fichas.",
 {fondo:"#e9e2c8",nav:"#f6f0da",acento:"#2f7d12",texto:"#1d2b14",panel:"rgba(250,246,226,.95)",campo:"#fffdf2",sobre:"#ffffff",filtro:"brightness(1.15) saturate(.6)",op:.35}]];
document.getElementById("r").innerHTML=T.map(([n,d,v])=>`
<section class="tema" style="${Object.entries(v).map(([k,x])=>`--${k}:${x}`).join(";")}">
<div class="foto"></div>
<div class="nombre">${n}</div><p class="desc">${d}</p>
<div class="sw"><i style="background:${v.acento}"></i><i style="background:${v.fondo}"></i><i style="background:${v.texto}"></i></div>
<div class="nav"><span>Inicio</span><span>Dinosaurios</span><span>Quiz</span><span class="sp"></span><span class="b">Iniciar sesión</span><span class="b d">Registrarse</span></div>
<div class="cont"><div class="panel"><h3>Registrarse</h3>La Sauripedia es la mayor enciclopedia de dinosaurios jamás creada.
<input placeholder="Ingrese su contraseña (mínimo 8 caracteres)"></div><div class="btn">Ingresar</div></div></section>`).join("");
</script></body></html>
